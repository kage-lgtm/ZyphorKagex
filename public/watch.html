<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZK Dubbing Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; background-color: #000; color: #fff; font-family: Arial, sans-serif; overflow: hidden; }
        
        .player-container { position: relative; width: 100vw; height: 100vh; background: #000; display: flex; justify-content: center; align-items: center; }
        
        /* ZK Dubbing Logo Overlay */
        .brand-logo { 
            position: absolute; 
            top: 15px; 
            left: 15px; 
            width: 80px; 
            z-index: 20; 
            opacity: 0.85; 
            pointer-events: none; 
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.8));
        }

        /* Video / Embed Frame */
        .stream-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Dynamic Watermark Overlay */
        #watermark {
            position: absolute; 
            top: 30%; 
            left: 30%;
            color: rgba(255, 255, 255, 0.35); 
            font-size: 13px;
            font-weight: bold; 
            pointer-events: none; 
            z-index: 15;
            transition: all 1.5s ease-in-out; 
            text-shadow: 1px 1px 3px #000;
        }

        #errorMsg { display: none; text-align: center; color: #ff4d4d; font-size: 16px; padding: 20px; z-index: 30; }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- ZK Dubbing Logo -->
        <img src="https://i.ibb.co/2Yp3CDq9/file-000000006f2c8211b20c6bedc9f9ac12.png" alt="ZK Logo" class="brand-logo">

        <!-- Dynamic Floating Watermark -->
        <div id="watermark">ZK Dubbing Studio</div>

        <!-- Video Container (Holds video or iframe) -->
        <div id="mediaContainer" style="width:100%; height:100%;"></div>

        <div id="errorMsg">Streaming link expired ya invalid hai.</div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const episodeId = urlParams.get('id');
        const token = urlParams.get('token');

        const user = tg?.initDataUnsafe?.user;
        const viewerText = user ? `${user.username || user.first_name} (${user.id})` : 'Guest User';

        // Watermark Movement
        const wm = document.getElementById('watermark');
        wm.innerText = `ZK Dubbing | ${viewerText}`;
        setInterval(() => {
            wm.style.top = Math.floor(Math.random() * 70) + 15 + '%';
            wm.style.left = Math.floor(Math.random() * 60) + 10 + '%';
        }, 4000);

        async function loadEpisode() {
            if (!episodeId) {
                showError("Episode ID missing.");
                return;
            }

            try {
                const res = await fetch(`/api/get-episode-data?episodeId=${episodeId}&token=${token}`);
                const data = await res.json();

                if (data.success) {
                    const container = document.getElementById('mediaContainer');
                    const videoSrc = data.videoUrl;

                    // Check if input is iframe or URL
                    if (videoSrc.includes('<iframe') || videoSrc.includes('src=')) {
                        container.innerHTML = videoSrc;
                        const iframe = container.querySelector('iframe');
                        if (iframe) {
                            iframe.style.width = '100%';
                            iframe.style.height = '100%';
                            iframe.style.border = 'none';
                        }
                    } else if (videoSrc.startsWith('http://') || videoSrc.startsWith('https://')) {
                        // If it's an embed link or video link
                        container.innerHTML = `<iframe src="${videoSrc}" class="stream-frame" allowfullscreen></iframe>`;
                    } else {
                        showError("Invalid Embed or Video Link.");
                    }
                } else {
                    showError(data.message);
                }
            } catch (err) {
                showError("Video load karne mein error aaya.");
            }
        }

        function showError(msg) {
            const errDiv = document.getElementById('errorMsg');
            errDiv.innerText = msg;
            errDiv.style.display = 'block';
        }

        loadEpisode();

        // Anti-Piracy Protection
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || (e.ctrlKey && e.keyCode === 85)) {
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>
</html>
